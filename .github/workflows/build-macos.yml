name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app
        run: PYTHON=python zsh build_standalone.sh

      - name: Smoke test (real transcription)
        run: |
          python -c "
          import wave, math, struct
          sr = 16000
          with wave.open('test.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h', int(9000 * math.sin(2 * math.pi * 440 * i / sr))) for i in range(sr * 3)))
          "
          set +e
          "Armenian Transcription.app/Contents/MacOS/Armenian Transcription" test.wav > smoke.log 2>&1
          code=$?
          cat smoke.log
          if [ $code -ne 0 ] || [ ! -f test.txt ]; then
            tail -c 3500 smoke.log | python -c "import sys,urllib.parse;print('::error title=Smoke test::'+sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
            exit 1
          fi
          echo "OK: test.txt created"

      - uses: actions/upload-artifact@v4
        with:
          name: ArmenianTranscription-macOS-standalone
          path: ArmenianTranscription-macOS-standalone.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ArmenianTranscription-macOS-standalone.zip
